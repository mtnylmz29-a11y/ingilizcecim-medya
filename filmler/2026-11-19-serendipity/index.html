<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { clamp, lerp, seg, ss, eio, eo, back, mulberry, vnoise, TAU } from '/core/lib.js';
const W = 1080, H = 1920;
const C = document.getElementById('c'), X = C.getContext('2d');
const R = mulberry(19);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ---------- palette: dyes, raw hide, ink ----------
const D = { verm: '#c9432b', ochre: '#d39a3a', jade: '#3f8f6e', indigo: '#34508f', gold: '#e2b04a', plum: '#7d3b5c',
  hide: '#e6c592', ink: '#2a160c', wood: '#7a4a26', ivory: '#ece0c4', grey: '#cfc6b6' };

// ---------- hide texture ----------
const HT = mk(256, 256); { const g = HT.getContext('2d'), im = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const n = 0.55 * vnoise(x / 23 + vnoise(y / 31) * 3) + 0.3 * vnoise(y / 9 + x / 40 + 7) + 0.15 * R();
    const v = 150 + n * 105, i = (y * 256 + x) * 4; im.data[i] = v; im.data[i + 1] = v * 0.9; im.data[i + 2] = v * 0.78; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  g.strokeStyle = 'rgba(70,40,20,.25)'; g.lineWidth = 1;
  for (let i = 0; i < 60; i++) { g.beginPath(); const x = R() * 256, y = R() * 256; g.moveTo(x, y); g.quadraticCurveTo(x + R() * 30, y + R() * 10, x + 20 + R() * 40, y + R() * 20 - 10); g.stroke(); } }
let HP = null;

// ---------- sprite helpers ----------
function spr(w, h, ax, ay, fn) { const c = mk(w, h), g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; fn(g); return { c, ax, ay, w, h }; }
function P(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function E(g, x, y, rx, ry, r = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, r, 0, TAU); }
function fill(g, path, col) { g.beginPath(); path(); g.fillStyle = col; g.fill(); }
function texture(g, w, h, a = .38) { g.save(); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = a; g.fillStyle = HP || (HP = g.createPattern(HT, 'repeat')); g.fillRect(0, 0, w, h); g.restore(); }
function cut(g, path, rim = 2.2) { g.save(); g.beginPath(); path(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(); g.restore(); if (rim) { g.beginPath(); path(); g.strokeStyle = D.ink; g.lineWidth = rim; g.stroke(); } }
function line(g, path, w = 2.2, col = D.ink) { g.beginPath(); path(); g.strokeStyle = col; g.lineWidth = w; g.stroke(); }
function diamonds(g, x0, y0, x1, y1, s = 12) { for (let y = y0; y < y1; y += s) for (let x = x0 + ((y / s) & 1) * s / 2; x < x1; x += s) cut(g, () => P(g, [[x, y - s * .32], [x + s * .3, y], [x, y + s * .32], [x - s * .3, y]]), 1.2); }
function coins(g, x0, y0, x1, y1, s = 18, r = 5) { for (let y = y0; y < y1; y += s) for (let x = x0 + ((y / s) & 1) * s / 2; x < x1; x += s) { cut(g, () => E(g, x, y, r, r), 1.2); g.fillStyle = D.ink; g.fillRect(x - r * .35, y - r * .35, r * .7, r * .7); } }
function crescents(g, x0, y0, x1, y1, s = 16) { for (let y = y0; y < y1; y += s * .7) for (let x = x0 + ((y / s) & 1) * s / 2; x < x1; x += s) cut(g, () => { g.beginPath(); g.arc(x, y, s * .38, .15 * Math.PI, .85 * Math.PI); g.arc(x, y - s * .12, s * .3, .8 * Math.PI, .2 * Math.PI, true); g.closePath(); }, 1); }
function slits(g, x0, y0, x1, y1, n, len = 26) { const r = mulberry(x0 * 7 + y0); for (let i = 0; i < n; i++) { const x = lerp(x0, x1, r()), y = lerp(y0, y1, r()); cut(g, () => P(g, [[x, y], [x + len, y - 3], [x + len * 1.1, y], [x + len, y + 2]]), 1); } }
function outline(g, path, w = 2.4) { line(g, path, w); }

// ---------- puppets ----------
function princeParts(d1, d2, d3, crown) {
  const torso = spr(150, 320, 70, 245, g => {
    const body = () => P(g, [[38, 18], [102, 18], [116, 150], [130, 305], [10, 305], [24, 150]]);
    fill(g, body, d1); fill(g, () => E(g, 70, 26, 56, 22), d2); texture(g, 150, 320);
    diamonds(g, 46, 62, 96, 140, 13); slits(g, 22, 190, 118, 295, 7, 30);
    fill(g, () => g.rect(26, 152, 90, 16), D.ink);
    crescents(g, 26, 20, 114, 40, 15); outline(g, body); outline(g, () => E(g, 70, 26, 56, 22));
  });
  const head = spr(170, 220, 70, 200, g => {
    const face = () => P(g, [[52, 80], [92, 78], [104, 112], [118, 124], [104, 132], [108, 146], [98, 152], [96, 166], [80, 182], [62, 200], [40, 160], [36, 112]]);
    fill(g, face, D.hide); texture(g, 170, 220, .3);
    cut(g, () => P(g, [[58, 92], [86, 90], [94, 116], [92, 140], [84, 160], [70, 176], [56, 160], [50, 116]]), 2);
    fill(g, () => P(g, [[80, 112], [100, 108], [84, 118]]), D.ink); // eye
    fill(g, () => E(g, 42, 134, 18, 30), D.ink); // hair at the back
    if (crown === 'turban') {
      const tb = () => { g.beginPath(); g.moveTo(30, 92); g.bezierCurveTo(20, 40, 70, 10, 104, 40); g.bezierCurveTo(118, 56, 112, 84, 102, 92); g.closePath(); };
      fill(g, tb, d2); texture(g, 170, 220, .3); crescents(g, 34, 46, 104, 86, 14); outline(g, tb);
      fill(g, () => E(g, 98, 46, 10, 10), D.gold); outline(g, () => E(g, 98, 46, 10, 10), 1.5);
      line(g, () => { g.beginPath(); g.moveTo(96, 38); g.quadraticCurveTo(110, 0, 140, 6); }, 5, d1);
    } else {
      const cr = () => P(g, [[28, 92], [32, 46], [48, 64], [62, 28], [76, 62], [92, 34], [100, 66], [110, 44], [108, 92]]);
      fill(g, cr, D.gold); texture(g, 170, 220, .3); coins(g, 44, 74, 100, 90, 16, 4.5); outline(g, cr);
    }
    outline(g, face);
  });
  const arm = spr(60, 200, 30, 16, g => {
    const sl = () => P(g, [[14, 6], [46, 6], [44, 120], [52, 150], [8, 150], [16, 120]]);
    fill(g, sl, d2); texture(g, 60, 200); crescents(g, 14, 130, 48, 150, 12); outline(g, sl);
    fill(g, () => E(g, 30, 166, 14, 15), D.hide); outline(g, () => E(g, 30, 166, 14, 15), 1.8);
    fill(g, () => E(g, 30, 16, 10, 10), D.ink); fill(g, () => E(g, 30, 16, 4, 4), D.ivory);
  });
  const leg = spr(70, 170, 24, 12, g => {
    const tr = () => P(g, [[8, 4], [40, 4], [38, 118], [12, 118]]);
    fill(g, tr, d3); texture(g, 70, 170); slits(g, 12, 20, 36, 110, 4, 18); outline(g, tr);
    const bt = () => { g.beginPath(); g.moveTo(10, 116); g.lineTo(40, 116); g.lineTo(44, 140); g.quadraticCurveTo(66, 138, 68, 152); g.lineTo(10, 156); g.closePath(); };
    fill(g, bt, D.ink);
  });
  return { torso, head, arm, leg };
}
const PR = [princeParts(D.verm, D.gold, D.indigo, 'turban'), princeParts(D.jade, D.verm, D.ochre, 'crown'), princeParts(D.indigo, D.jade, D.verm, 'turban')];

const LANTERN = spr(90, 150, 45, 10, g => {
  const b = () => P(g, [[22, 34], [68, 34], [80, 80], [68, 126], [22, 126], [10, 80]]);
  fill(g, b, D.verm); texture(g, 90, 150); diamonds(g, 22, 50, 70, 116, 12); outline(g, b);
  fill(g, () => g.rect(18, 24, 54, 12), D.ink); fill(g, () => g.rect(18, 124, 54, 10), D.ink);
  line(g, () => { g.beginPath(); g.moveTo(45, 24); g.lineTo(45, 4); }, 3);
});
const GEM = spr(130, 150, 65, 75, g => {
  const gm = () => P(g, [[65, 8], [118, 52], [65, 142], [12, 52]]);
  fill(g, gm, D.verm); texture(g, 130, 150, .25);
  cut(g, () => P(g, [[65, 22], [96, 52], [65, 58], [34, 52]]), 2);
  cut(g, () => P(g, [[44, 66], [62, 70], [62, 118]]), 2); cut(g, () => P(g, [[86, 66], [68, 70], [68, 118]]), 2);
  outline(g, gm, 3);
});

// camel
const CAMEL = (() => {
  const body = spr(360, 230, 180, 150, g => {
    const b = () => { g.beginPath(); g.moveTo(30, 140); g.bezierCurveTo(30, 90, 70, 80, 110, 70); g.bezierCurveTo(140, 10, 200, 10, 222, 64); g.bezierCurveTo(260, 70, 300, 80, 320, 110); g.bezierCurveTo(330, 160, 300, 180, 260, 182); g.lineTo(80, 182); g.bezierCurveTo(40, 180, 28, 166, 30, 140); g.closePath(); };
    fill(g, b, D.ochre); texture(g, 360, 230); crescents(g, 130, 36, 216, 80, 15);
    const bl = () => P(g, [[120, 92], [240, 92], [250, 160], [112, 160]]);
    fill(g, bl, D.verm); texture(g, 360, 230, .25); diamonds(g, 128, 104, 236, 152, 14); outline(g, bl);
    outline(g, b); slits(g, 40, 120, 110, 170, 4, 22);
  });
  const neck = spr(200, 230, 30, 200, g => {
    const n = () => { g.beginPath(); g.moveTo(10, 210); g.bezierCurveTo(40, 150, 70, 120, 96, 60); g.bezierCurveTo(110, 28, 150, 22, 180, 40); g.lineTo(186, 60); g.bezierCurveTo(160, 70, 140, 66, 128, 80); g.bezierCurveTo(110, 130, 90, 180, 60, 226); g.closePath(); };
    fill(g, n, D.ochre); texture(g, 200, 230); crescents(g, 50, 110, 110, 200, 14); outline(g, n);
    fill(g, () => E(g, 150, 42, 6, 4), D.ink); fill(g, () => E(g, 118, 34, 8, 12, -.4), D.ink);
  });
  const leg = spr(40, 170, 20, 10, g => {
    const l = () => P(g, [[6, 4], [34, 4], [30, 90], [28, 150], [36, 162], [6, 162], [12, 150], [10, 90]]);
    fill(g, l, D.ochre); texture(g, 40, 170); outline(g, l); fill(g, () => E(g, 20, 92, 10, 10), D.ink); fill(g, () => E(g, 20, 92, 4, 4), D.ivory);
  });
  return { body, neck, leg };
})();

// scenery
const SEA = spr(1400, 170, 0, 0, g => {
  const s = () => { g.beginPath(); g.moveTo(0, 30); for (let x = 0; x <= 1400; x += 70) g.quadraticCurveTo(x + 35, 0, x + 70, 30); g.lineTo(1400, 170); g.lineTo(0, 170); g.closePath(); };
  fill(g, s, D.indigo); texture(g, 1400, 170); for (let r = 0; r < 3; r++) for (let x = 20 + r * 30; x < 1380; x += 90) cut(g, () => { g.beginPath(); g.moveTo(x, 60 + r * 35); g.quadraticCurveTo(x + 25, 48 + r * 35, x + 50, 60 + r * 35); g.quadraticCurveTo(x + 25, 54 + r * 35, x, 60 + r * 35); }, 1.2);
  outline(g, s);
});
function palm(g, x, y, h, lean) {
  const tr = () => { g.beginPath(); g.moveTo(x - 12, y); g.quadraticCurveTo(x + lean * .4, y - h * .5, x + lean - 6, y - h); g.lineTo(x + lean + 6, y - h); g.quadraticCurveTo(x + lean * .4 + 14, y - h * .5, x + 12, y); g.closePath(); };
  fill(g, tr, D.wood); outline(g, tr);
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * .55, L = 110; const tx = x + lean, ty = y - h;
    const lf = () => { g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(tx + Math.cos(a - .3) * L * .6, ty + Math.sin(a - .3) * L * .6 - 30, tx + Math.cos(a) * L, ty + Math.sin(a) * L + 40); g.quadraticCurveTo(tx + Math.cos(a + .3) * L * .5, ty + Math.sin(a + .3) * L * .5 - 10, tx, ty); g.closePath(); };
    fill(g, lf, D.jade); outline(g, lf, 1.8); }
}
const ISLAND = spr(820, 560, 410, 520, g => {
  const pk = () => P(g, [[250, 520], [430, 110], [470, 90], [510, 120], [690, 520]]);
  fill(g, pk, D.ochre); texture(g, 820, 560);
  for (let i = 0; i < 6; i++) cut(g, () => { const y = 180 + i * 56; g.beginPath(); g.moveTo(430 - i * 30, y); g.quadraticCurveTo(470, y - 14, 510 + i * 30, y); g.quadraticCurveTo(470, y - 4, 430 - i * 30, y); }, 1.2);
  outline(g, pk);
  const gr = () => { g.beginPath(); g.moveTo(20, 520); g.bezierCurveTo(120, 380, 300, 400, 410, 430); g.bezierCurveTo(560, 400, 720, 380, 800, 520); g.closePath(); };
  fill(g, gr, D.jade); texture(g, 820, 560); crescents(g, 80, 460, 760, 515, 18); outline(g, gr);
  palm(g, 150, 470, 230, -40); palm(g, 260, 440, 300, 30); palm(g, 680, 460, 250, 40);
});
const LION = spr(300, 220, 150, 210, g => {
  const b = () => { g.beginPath(); g.moveTo(70, 120); g.bezierCurveTo(100, 90, 200, 90, 240, 110); g.lineTo(250, 200); g.lineTo(228, 200); g.lineTo(220, 150); g.lineTo(110, 150); g.lineTo(100, 200); g.lineTo(78, 200); g.closePath(); };
  fill(g, b, D.gold); texture(g, 300, 220); crescents(g, 120, 104, 220, 140, 14); outline(g, b);
  const mn = () => { g.beginPath(); for (let i = 0; i < 12; i++) { const a = i / 12 * TAU, r = i % 2 ? 46 : 60; g.lineTo(70 + Math.cos(a) * r, 92 + Math.sin(a) * r); } g.closePath(); };
  fill(g, mn, D.verm); texture(g, 300, 220, .25); outline(g, mn);
  fill(g, () => E(g, 66, 94, 32, 30), D.gold); cut(g, () => E(g, 62, 86, 6, 4), 1.5); outline(g, () => E(g, 66, 94, 32, 30));
  line(g, () => { g.beginPath(); g.moveTo(240, 115); g.quadraticCurveTo(290, 80, 280, 40); }, 5);
});
const DUNES = spr(1500, 260, 0, 0, g => {
  const d = () => { g.beginPath(); g.moveTo(0, 120); g.bezierCurveTo(200, 30, 380, 40, 560, 110); g.bezierCurveTo(760, 20, 1000, 30, 1150, 100); g.bezierCurveTo(1300, 50, 1420, 60, 1500, 90); g.lineTo(1500, 260); g.lineTo(0, 260); g.closePath(); };
  fill(g, d, D.ochre); texture(g, 1500, 260);
  for (let i = 0; i < 5; i++) for (let x = 30 + i * 40; x < 1480; x += 240) cut(g, () => { const y = 130 + i * 26; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 70, y - 10, x + 140, y); g.quadraticCurveTo(x + 70, y - 4, x, y); }, 1);
  outline(g, d);
});
const SKY = spr(1500, 420, 0, 0, g => {
  const s = () => { g.beginPath(); g.moveTo(0, 0); g.lineTo(1500, 0); g.lineTo(1500, 380); for (let x = 1500; x >= 0; x -= 75) g.quadraticCurveTo(x - 37, 420, x - 75, 380); g.closePath(); };
  fill(g, s, '#3a2b4a'); texture(g, 1500, 420, .3); outline(g, s);
  const r = mulberry(5); for (let i = 0; i < 46; i++) { const x = 30 + r() * 1440, y = 30 + r() * 320, k = 5 + r() * 7;
    cut(g, () => { g.beginPath(); for (let j = 0; j < 8; j++) { const a = j / 8 * TAU, rr = j % 2 ? k * .4 : k; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }, 1); }
  cut(g, () => { g.beginPath(); g.arc(1180, 150, 60, 0, TAU); g.arc(1210, 130, 52, 0, TAU, true); }, 2);
});
function item(kind) { return spr(140, 140, 70, 70, g => {
  if (kind === 'key') { const k = () => { g.beginPath(); g.arc(40, 70, 26, 0, TAU); g.rect(62, 62, 66, 16); g.rect(104, 76, 10, 22); g.rect(118, 76, 10, 16); }; fill(g, k, D.gold); texture(g, 140, 140, .25); cut(g, () => E(g, 40, 70, 12, 12), 2); outline(g, k); }
  if (kind === 'ring') { fill(g, () => E(g, 70, 82, 40, 40), D.gold); texture(g, 140, 140, .25); cut(g, () => E(g, 70, 82, 26, 26), 2); outline(g, () => E(g, 70, 82, 40, 40)); fill(g, () => P(g, [[70, 18], [92, 40], [70, 56], [48, 40]]), D.jade); outline(g, () => P(g, [[70, 18], [92, 40], [70, 56], [48, 40]])); }
  if (kind === 'scroll') { const s = () => g.rect(26, 34, 88, 72); fill(g, s, D.ivory); texture(g, 140, 140, .3); for (let i = 0; i < 4; i++) cut(g, () => g.rect(38, 50 + i * 13, 64, 4), 0); outline(g, s); fill(g, () => g.rect(18, 28, 104, 10), D.wood); fill(g, () => g.rect(18, 102, 104, 10), D.wood); }
}); }
const ITEMS = [item('key'), item('ring'), item('scroll')];

// Walpole (a historical writer), seated, with quill arm
const WAL = (() => {
  const body = spr(300, 460, 130, 440, g => {
    const ch = () => P(g, [[20, 120], [50, 120], [56, 300], [180, 300], [184, 440], [164, 440], [160, 330], [56, 330], [48, 440], [28, 440]]);
    fill(g, ch, D.wood); texture(g, 300, 460); diamonds(g, 28, 140, 48, 290, 12); outline(g, ch);
    const coat = () => P(g, [[70, 150], [150, 140], [176, 300], [60, 316]]);
    fill(g, coat, D.indigo); texture(g, 300, 460); crescents(g, 76, 230, 166, 300, 15); outline(g, coat);
    for (let i = 0; i < 4; i++) { fill(g, () => E(g, 150 + i * 3, 172 + i * 28, 5, 5), D.gold); }
    const br = () => P(g, [[90, 290], [236, 296], [240, 330], [96, 334]]); fill(g, br, D.ochre); texture(g, 300, 460); outline(g, br);
    const sh = () => P(g, [[214, 320], [240, 320], [238, 420], [262, 430], [266, 446], [212, 446]]); fill(g, sh, D.ivory); outline(g, sh); fill(g, () => g.rect(210, 430, 58, 16), D.ink); fill(g, () => g.rect(232, 426, 12, 8), D.gold);
    const face = () => P(g, [[110, 60], [150, 62], [160, 96], [174, 108], [160, 114], [164, 128], [154, 134], [150, 150], [120, 160], [100, 120]]);
    fill(g, face, D.hide); texture(g, 300, 460, .3); cut(g, () => P(g, [[116, 72], [146, 74], [150, 100], [148, 124], [138, 144], [118, 148], [108, 116]]), 2);
    fill(g, () => P(g, [[138, 96], [156, 92], [140, 102]]), D.ink); outline(g, face);
    const wig = () => { g.beginPath(); g.moveTo(104, 120); g.bezierCurveTo(70, 100, 80, 40, 120, 36); g.bezierCurveTo(150, 30, 160, 50, 150, 66); g.lineTo(112, 68); g.lineTo(112, 136); g.closePath(); };
    fill(g, wig, D.grey); texture(g, 300, 460, .3); coins(g, 88, 56, 112, 126, 16, 4); outline(g, wig);
    fill(g, () => P(g, [[80, 110], [66, 150], [92, 146]]), D.ink);
    const cr = () => P(g, [[120, 156], [156, 150], [150, 180], [128, 176]]); fill(g, cr, D.ivory); outline(g, cr, 1.6);
  });
  const arm = spr(170, 120, 20, 30, g => {
    const sl = () => P(g, [[8, 14], [100, 18], [104, 48], [10, 50]]); fill(g, sl, D.indigo); texture(g, 170, 120); outline(g, sl);
    const cf = () => P(g, [[96, 12], [118, 8], [122, 58], [98, 54]]); fill(g, cf, D.ivory); coins(g, 104, 18, 118, 54, 12, 3); outline(g, cf);
    fill(g, () => E(g, 132, 36, 14, 13), D.hide); outline(g, () => E(g, 132, 36, 14, 13), 1.6);
    const q = () => { g.beginPath(); g.moveTo(136, 46); g.quadraticCurveTo(150, 0, 168, 2); g.quadraticCurveTo(160, 20, 140, 46); g.closePath(); };
    fill(g, q, D.ivory); slits(g, 144, 10, 160, 36, 3, 8); outline(g, q, 1.6);
  });
  const desk = spr(420, 300, 210, 290, g => {
    const dk = () => P(g, [[10, 20], [410, 20], [410, 50], [380, 50], [380, 290], [350, 290], [350, 50], [70, 50], [70, 290], [40, 290], [40, 50], [10, 50]]);
    fill(g, dk, D.wood); texture(g, 420, 300); diamonds(g, 80, 60, 340, 120, 14); outline(g, dk);
  });
  const book = spr(240, 110, 120, 100, g => {
    const bk = () => { g.beginPath(); g.moveTo(10, 90); g.quadraticCurveTo(60, 60, 120, 84); g.quadraticCurveTo(180, 60, 230, 90); g.lineTo(226, 30); g.quadraticCurveTo(176, 4, 120, 26); g.quadraticCurveTo(64, 4, 14, 30); g.closePath(); };
    fill(g, bk, D.ivory); texture(g, 240, 110, .3);
    for (let i = 0; i < 3; i++) cut(g, () => { const x = 140 + i * 26; g.beginPath(); g.arc(x, 40, 7, 0, TAU); g.rect(x - 7, 46, 14, 26); }, 1);
    for (let i = 0; i < 4; i++) cut(g, () => g.rect(30, 34 + i * 12, 70, 3), 0);
