<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/core/fonts/fonts.css">
<style>html,body{margin:0;background:#f1e6cf;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Kelimelerin Tarihçesi: Muscle — 1950'ler düz renkli çizgi film (midcentury-toon) — ingilizcecim.com
import { clamp, lerp, seg, ss, eio, eo, back, mulberry, hash, TAU } from '/core/lib.js';
const W = 1080, H = 1920;
const C = document.getElementById('c'), X = C.getContext('2d');
const KAPAK = /kapak=1/.test(location.search);

// ---------- palette: tomato / mustard / turquoise / plum on cream ----------
const K = { paper: '#f1e6cf', paper2: '#e6d6b4', ink: '#2b211b', tomato: '#d9573b', mustard: '#e0a93a', turq: '#3f9c94',
  powder: '#9cc3c9', olive: '#8c9441', plum: '#7b4a6b', sand: '#d8b98a', coral: '#e9876a', grey: '#a9a39a', greyD: '#7d776f',
  pink: '#e8a3a0', skin: '#e9b98f', skinD: '#c98f66', white: '#fbf4e4', lime: '#b7c25a', navy: '#33465e' };

// ---------- time & register (on twos) ----------
let T = 0, TW = 0;
let REG = [4, 3];
function setClock(t) { T = t; TW = Math.floor(t * 12); REG = [4 + (hash(TW * 1.7) - .5) * 3, 3 + (hash(TW * 2.3 + 5) - .5) * 3]; }
function jit(id) { return (hash(TW * 0.37 + id * 13.1) - .5) * 2; }

// ---------- camera (world -> screen) ----------
let CAM = { x: 540, y: 960, z: 1 };
function cam() { X.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z); }
function scr() { X.setTransform(1, 0, 0, 1, 0, 0); }

// ---------- the style's shape: off-register fill + broken breathing ink ----------
let SID = 0;
function shape(path, fill, o = {}) {
  const id = o.id != null ? o.id : (SID++);
  if (fill) { X.save(); X.translate(o.noreg ? 0 : REG[0], o.noreg ? 0 : REG[1]); X.beginPath(); path(); X.fillStyle = fill; X.fill(o.rule || 'nonzero'); X.restore(); }
  if (o.shade) { X.save(); X.translate(REG[0], REG[1]); X.beginPath(); path(); X.clip(); X.beginPath(); o.shade(); X.fillStyle = o.shadeCol || 'rgba(60,30,20,.18)'; X.fill(); X.restore(); }
  if (o.line !== false) {
    const lw = o.lw || 4, r = mulberry(id * 97 + 11 + (TW % 3));
    X.save(); X.beginPath(); path();
    const d = []; for (let i = 0; i < 6; i++) { d.push(30 + r() * 90, 4 + r() * (o.gap || 14)); }
    X.setLineDash(d); X.lineDashOffset = r() * 50;
    X.strokeStyle = o.col || K.ink; X.lineWidth = lw * (0.85 + r() * .3); X.lineJoin = 'round'; X.lineCap = 'round'; X.stroke();
    X.restore();
  }
}
const E = (x, y, rx, ry, r = 0) => () => X.ellipse(x, y, rx, ry, r, 0, TAU);
const R = (x, y, w, h, rr = 0) => () => rr ? X.roundRect(x, y, w, h, rr) : X.rect(x, y, w, h);
const P = pts => () => { pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.closePath(); };
function ink(pts, lw = 4, col = K.ink) { X.save(); X.beginPath(); pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'round'; X.lineJoin = 'round'; X.stroke(); X.restore(); }
function curve(x0, y0, cx, cy, x1, y1, lw = 4, col = K.ink) { X.save(); X.beginPath(); X.moveTo(x0, y0); X.quadraticCurveTo(cx, cy, x1, y1); X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'round'; X.stroke(); X.restore(); }

// ---------- ornaments ----------
function starburst(x, y, r0, r1, n, col, rot = 0, o = {}) {
  shape(() => { for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r0 : r1; i ? X.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : X.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } X.closePath(); }, col, o);
}
function sparkle(x, y, s, col = K.white, rot = 0) {
  X.save(); X.translate(x, y); X.rotate(rot); X.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * .22 : s; X.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  X.closePath(); X.fillStyle = col; X.fill(); X.restore();
}
function rays(x, y, r, col, a = .25, rot = 0) {
  X.save(); X.globalAlpha *= a; X.fillStyle = col;
  for (let i = 0; i < 30; i += 2) { const a0 = rot + i * TAU / 30, a1 = rot + (i + 1) * TAU / 30; X.beginPath(); X.moveTo(x, y); X.arc(x, y, r, a0, a1); X.closePath(); X.fill(); }
  X.restore();
}
function boomerang(x, y, s, col, rot) { X.save(); X.translate(x, y); X.rotate(rot); shape(() => { X.moveTo(-s, 0); X.quadraticCurveTo(0, -s * .9, s, 0); X.quadraticCurveTo(0, -s * .35, -s, 0); }, col, { lw: 3 }); X.restore(); }
function dots(x0, y0, x1, y1, s, col, a = .35) { X.save(); X.globalAlpha *= a; X.fillStyle = col; for (let y = y0; y < y1; y += s) for (let x = x0 + ((y - y0) / s & 1) * s / 2; x < x1; x += s) { X.beginPath(); X.arc(x, y, s * .14, 0, TAU); X.fill(); } X.restore(); }

// ---------- room: one colour plane, floor band, broken horizon ----------
function room(wall, floor, hy = 1180) {
  X.fillStyle = wall; X.fillRect(-400, -400, 1900, hy + 400);
  X.fillStyle = floor; X.fillRect(-400, hy, 1900, 1400);
  const r = mulberry(hy | 0); let x = -200; X.strokeStyle = K.ink; X.lineWidth = 4;
  while (x < 1300) { const l = 120 + r() * 260; X.beginPath(); X.moveTo(x, hy); X.lineTo(x + l, hy); X.stroke(); x += l + 20 + r() * 40; }
}

// ---------- text with two plates ----------
function ttext(s, x, y, font, col, plate, o = {}) {
  X.save(); X.font = font; X.textAlign = o.align || 'center'; X.textBaseline = 'middle';
  if (plate) { X.fillStyle = plate; X.fillText(s, x + REG[0] + 2, y + REG[1] + 2); }
  X.fillStyle = col; X.fillText(s, x, y);
  if (o.stroke) { X.lineWidth = o.stroke; X.strokeStyle = K.ink; X.strokeText(s, x, y); }
  X.restore();
}
function fitFont(s, base, family, maxW) { let sz = base; X.font = `${sz}px ${family}`; while (X.measureText(s).width > maxW && sz > 20) { sz -= 2; X.font = `${sz}px ${family}`; } return `${sz}px ${family}`; }

// paper tag with star bullet, pops with back-ease
function tag(t, t0, x, y, lines, o = {}) {
  const k = back(seg(t, t0, t0 + .3), 2.2); if (k <= 0) return;
  X.save(); X.translate(x, y); X.rotate(o.rot || 0); X.scale(k, k);
  X.font = o.font || '600 50px Fredoka';
  const w = Math.max(...lines.map(l => X.measureText(l).width)) + 110, lh = o.lh || 62, h = lines.length * lh + 44;
  shape(R(-w / 2, -h / 2, w, h, 20), o.bg || K.white, { lw: 4, id: 900 + (o.id || 0) });
  X.fillStyle = o.star || K.tomato; sparkle(-w / 2 + 38, -h / 2 + 22 + lh / 2, 18, o.star || K.tomato, T * .8);
  lines.forEach((l, i) => { X.fillStyle = (o.cols && o.cols[i]) || K.ink; X.textAlign = 'center'; X.textBaseline = 'middle'; X.font = (o.fonts && o.fonts[i]) || o.font || '600 50px Fredoka'; X.fillText(l, 18, -h / 2 + 22 + lh * (i + .5)); });
  X.restore();
}
// numbered medallion
function medallion(t, t0, x, y, r, txt, col = K.ink, o = {}) {
  const k = back(seg(t, t0, t0 + .3), 2.4); if (k <= 0) return;
  X.save(); X.translate(x, y); X.scale(k, k);
  starburst(0, 0, r * 1.05, r * 1.25, 14, o.burst || K.mustard, T * .3, { lw: 3 });
  shape(E(0, 0, r, r), col, { lw: 4 });
  X.font = o.font || `${Math.round(r * .9)}px "Lilita One"`; X.fillStyle = K.paper; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(txt, 0, 4);
  X.restore();
}
// rubber stamp
function stamp(t, t0, x, y, txt, col = K.tomato) {
  const a = seg(t, t0, t0 + .18); if (a <= 0) return; const s = lerp(1.8, 1, eo(a));
  X.save(); X.translate(x, y); X.rotate(-.12); X.scale(s, s); X.globalAlpha *= clamp(a * 3);
  X.font = '64px "Lilita One"'; const w = X.measureText(txt).width + 70;
  X.strokeStyle = col; X.lineWidth = 8; X.setLineDash([60, 8, 30, 6]); X.beginPath(); X.roundRect(-w / 2, -54, w, 108, 14); X.stroke();
  X.setLineDash([]); X.fillStyle = col; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(txt, 0, 4);
  X.restore();
}

// ---------- characters ----------
// glove hand (4-finger cartoon glove)
function glove(x, y, s = 1, rot = 0, pose = 'open') {
  X.save(); X.translate(x, y); X.rotate(rot); X.scale(s, s);
  if (pose === 'point') {
    shape(() => { X.ellipse(0, 0, 26, 22, 0, 0, TAU); X.moveTo(14, -8); X.roundRect(10, -10, 46, 16, 8); }, K.white, { lw: 3.5 });
    ink([[-4, -6], [8, -4]], 2.2);
  } else if (pose === 'fist') {
    shape(E(0, 0, 26, 24), K.white, { lw: 3.5 }); ink([[-10, -8], [-10, 6]], 2); ink([[2, -10], [2, 6]], 2); ink([[13, -8], [13, 4]], 2);
  } else {
    shape(() => { X.ellipse(0, 0, 24, 22, 0, 0, TAU); for (let i = 0; i < 4; i++) { const a = -1.9 + i * .42; X.moveTo(Math.cos(a) * 18, Math.sin(a) * 18); X.ellipse(Math.cos(a) * 34, Math.sin(a) * 34, 15, 9, a, 0, TAU); } }, K.white, { lw: 3.5 });
  }
  X.restore();
}
// arm: thick ink ribbon with a colour ribbon on top, shoulder -> elbow -> hand
function arm(sx, sy, a1, l1, a2, l2, sleeve, o = {}) {
  const ex = sx + Math.cos(a1) * l1, ey = sy + Math.sin(a1) * l1, hx = ex + Math.cos(a1 + a2) * l2, hy = ey + Math.sin(a1 + a2) * l2;
  X.save(); X.lineCap = 'round'; X.lineJoin = 'round';
  X.beginPath(); X.moveTo(sx, sy); X.lineTo(ex, ey); X.lineTo(hx, hy); X.strokeStyle = K.ink; X.lineWidth = (o.w || 26) + 8; X.stroke();
  X.beginPath(); X.moveTo(sx + REG[0] * .5, sy + REG[1] * .5); X.lineTo(ex + REG[0] * .5, ey + REG[1] * .5); X.lineTo(hx, hy); X.strokeStyle = sleeve; X.lineWidth = o.w || 26; X.stroke();
  X.restore();
  glove(hx, hy, o.hs || 1, a1 + a2 + (o.hr || 0), o.pose || 'open');
  return { ex, ey, hx, hy };
}
// head: egg with the nose as part of the outline (facing right unless flip)
function eggHead(x, y, s, skin, o = {}) {
  X.save(); X.translate(x, y); X.scale(s * (o.flip ? -1 : 1), s);
  const path = () => { X.moveTo(0, -95); X.bezierCurveTo(60, -95, 78, -50, 74, -18); X.lineTo(104, 8); X.lineTo(72, 22); X.bezierCurveTo(66, 70, 30, 92, -4, 92); X.bezierCurveTo(-60, 92, -80, 50, -78, 0); X.bezierCurveTo(-76, -60, -48, -95, 0, -95); };
  shape(path, skin, { lw: 4.2, shade: () => X.rect(-90, 40, 200, 80), shadeCol: 'rgba(120,60,30,.18)', id: o.id || 50 });
  // ear
  shape(E(-30, 6, 14, 20), skin, { lw: 3.5, id: (o.id || 50) + 1 });
  // eye
  const bl = o.blink ? .15 : 1;
  X.fillStyle = K.white; X.beginPath(); X.ellipse(36, -22, 14, 17 * bl, 0, 0, TAU); X.fill(); X.strokeStyle = K.ink; X.lineWidth = 3; X.stroke();
  X.fillStyle = K.ink; X.beginPath(); X.ellipse(40 + (o.look || 0) * 4, -20, 6, 8 * bl, 0, 0, TAU); X.fill();
  // brow
  const b = o.brow || 0; ink([[22, -48 - b * 6], [52, -50 + b * 6]], 4.5);
  // mouth (open by speech)
  const m = o.mouth || 0;
  if (m > .1) { shape(() => X.ellipse(52, 46, 14, 4 + m * 14, 0, 0, TAU), '#8a3a2c', { lw: 3.2, noreg: true, id: (o.id || 50) + 2 }); }
  else ink([[38, 44], [52, 50 + (o.smile || 1) * 2], [64, 44]], 3.5);
  X.restore();
}

// the mouse: grey, small round ear, pointed snout, long tail
function mouse(x, y, s = 1, o = {}) {
  const run = o.run || 0, bob = Math.abs(Math.sin(run * 6)) * 8 * (o.running ? 1 : 0);
  X.save(); X.translate(x, y - bob * s); X.scale(s * (o.flip ? -1 : 1), s);
  // tail
  curve(-58, 8, -120, -30 + Math.sin(T * 5) * 20, -150, 30, 5, K.ink);
  // legs
  const lp = o.running ? Math.sin(run * 12) * 12 : 0;
  ink([[-28, 26], [-34 - lp, 46]], 6); ink([[24, 26], [30 + lp, 46]], 6);
  // body
  shape(() => { X.ellipse(-6, 0, 62, 40, -.05, 0, TAU); }, K.grey, { lw: 4, shade: () => X.rect(-80, 18, 160, 40), shadeCol: 'rgba(40,30,30,.18)', id: 70 });
  // belly
  X.fillStyle = 'rgba(251,244,228,.6)'; X.beginPath(); X.ellipse(4, 18, 34, 16, 0, 0, TAU); X.fill();
  // head + snout
  shape(() => { X.moveTo(30, -34); X.bezierCurveTo(60, -40, 84, -16, 104, -2); X.bezierCurveTo(84, 14, 58, 22, 36, 16); X.bezierCurveTo(20, 6, 18, -26, 30, -34); }, K.grey, { lw: 4, id: 71 });
  // ear
  shape(E(34, -42, 20, 24, -.3), K.grey, { lw: 3.5, id: 72 }); X.fillStyle = K.pink; X.beginPath(); X.ellipse(36, -41, 11, 14, -.3, 0, TAU); X.fill();
  // nose + whiskers
  X.fillStyle = K.pink; X.beginPath(); X.arc(105, -2, 7, 0, TAU); X.fill(); X.strokeStyle = K.ink; X.lineWidth = 2.5; X.stroke();
  ink([[96, 2], [128, -6]], 2); ink([[96, 6], [126, 12]], 2);
  // eye
  const bl = o.blink ? .2 : 1; X.fillStyle = K.ink; X.beginPath(); X.ellipse(66, -14, 6, 7 * bl, 0, 0, TAU); X.fill();
  if (o.wink) ink([[58, -14], [72, -12]], 3);
  X.restore();
}

// Roman physician (held body; arms, eyes, mouth animate)
function medicus(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s, s);
  // feet / sandals
  shape(R(-70, -20, 60, 20, 8), K.ink, { line: false }); shape(R(10, -20, 60, 20, 8), K.ink, { line: false });
  // toga body (trapezoid) + plum stripe sash
  const body = P([[-110, -20], [-80, -330], [80, -330], [120, -20]]);
  shape(body, K.white, { lw: 4.5, shade: () => X.rect(10, -340, 140, 330), shadeCol: 'rgba(120,100,80,.15)', id: 30 });
  shape(P([[-80, -330], [-30, -330], [90, -40], [40, -40]]), K.plum, { lw: 3.5, id: 31 });
  // back arm (left)
  const a = o.armL || [1.9, .3];
  arm(-70, -300, a[0], 110, a[1], 100, K.white, { w: 30, pose: o.poseL || 'open' });
  // head
  eggHead(4, -420, .95, K.skin, { mouth: o.mouth, brow: o.brow, look: o.look, blink: o.blink, id: 40 });
  // bald top + beard + laurel
  shape(() => { X.moveTo(-70, -380); X.bezierCurveTo(-60, -320, 20, -320, 60, -360); X.bezierCurveTo(40, -330, -20, -310, -50, -330); }, '#6b4a33', { lw: 3, id: 42 });
  for (let i = 0; i < 6; i++) { const ang = Math.PI + .35 + i * .42; shape(E(4 + Math.cos(ang) * 72, -440 + Math.sin(ang) * 74, 16, 8, ang + 1.4), K.olive, { lw: 2.5, id: 43 + i }); }
  // front arm (right)
  const b = o.armR || [1.4, -.2];
  arm(60, -300, b[0], 110, b[1], 100, K.white, { w: 30, pose: o.poseR || 'open' });
  X.restore();
}

// gladiator-athlete: tunic, big flexing arm, a "mouse" bump runs under the skin
function athlete(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s, s);
  // legs + sandals
  shape(R(-62, -200, 44, 190, 14), K.skin, { lw: 4, id: 80 }); shape(R(18, -200, 44, 190, 14), K.skin, { lw: 4, id: 81 });
  ink([[-62, -60], [-18, -60]], 5, '#6b4a33'); ink([[18, -60], [62, -60]], 5, '#6b4a33');
  shape(R(-76, -16, 66, 22, 8), '#6b4a33', { lw: 3, id: 82 }); shape(R(10, -16, 66, 22, 8), '#6b4a33', { lw: 3, id: 83 });
  // tunic
  shape(P([[-110, -190], [-96, -470], [96, -470], [110, -190]]), K.tomato, { lw: 4.5, shade: () => X.rect(20, -480, 120, 300), id: 84 });
  shape(R(-112, -250, 224, 34, 6), K.mustard, { lw: 3.5, id: 85 });
  // left arm resting
  arm(-96, -440, 1.75, 130, .2, 110, K.skin, { w: 40, pose: 'fist' });
  // head
  eggHead(0, -560, .9, K.skin, { mouth: o.mouth, brow: o.brow || -1, look: o.look, blink: o.blink, smile: 1, id: 86 });
  shape(() => { X.moveTo(-72, -600); X.bezierCurveTo(-50, -680, 40, -690, 66, -620); X.bezierCurveTo(30, -640, -20, -640, -72, -600); }, '#3d2a1f', { lw: 3, id: 87 });
  // flexing right arm: upper arm out to the right, forearm up
  const f = o.flex || 0, sx = 96, sy = -440;
  const a1 = lerp(.45, -0.05, f), a2 = lerp(.3, -1.95, f);
  const ex = sx + Math.cos(a1) * 170, ey = sy + Math.sin(a1) * 170, hx = ex + Math.cos(a1 + a2) * 150, hy = ey + Math.sin(a1 + a2) * 150;
  X.save(); X.lineCap = 'round'; X.lineJoin = 'round';
  X.beginPath(); X.moveTo(sx, sy); X.lineTo(ex, ey); X.lineTo(hx, hy); X.strokeStyle = K.ink; X.lineWidth = 58; X.stroke();
  X.beginPath(); X.moveTo(sx + 2, sy + 2); X.lineTo(ex + 2, ey + 2); X.lineTo(hx, hy); X.strokeStyle = K.skin; X.lineWidth = 50; X.stroke();
  X.restore();
  // biceps bulge (grows with flex) on top of the upper arm
  const mx = lerp(sx, ex, .55), my = lerp(sy, ey, .55) - 22 * f;
  if (f > .05) shape(E(mx, my, 62 * f + 10, 34 * f + 6, a1), K.skin, { lw: 4, id: 88, shade: () => X.rect(mx - 80, my + 10, 160, 60), shadeCol: 'rgba(150,80,40,.18)' });
  // the running bump (a mouse under the skin)
  if (o.bump != null) {
    const u = o.bump, bx = lerp(sx + 20, ex - 10, u), by = lerp(sy, ey, u) - 28 * f - 10;
    shape(E(bx, by, 34, 22, a1), K.skin, { lw: 3.5, id: 89 });
    ink([[bx - 40, by + 8], [bx - 62, by + 14 + Math.sin(T * 14) * 6]], 3, K.skinD);
  }
  glove(hx, hy, 1.2, a1 + a2, 'fist');
  X.restore();
  return { mx: x + mx * s, my: y + my * s, ex: x + ex * s, ey: y + ey * s };
}

// modern student in a turquoise hoodie with a dumbbell
function student(x, y, s, o = {}) {
  X.save(); X.translate(x, y); X.scale(s, s);
  shape(R(-56, -210, 46, 200, 14), K.navy, { lw: 4, id: 100 }); shape(R(10, -210, 46, 200, 14), K.navy, { lw: 4, id: 101 });
  shape(R(-74, -18, 70, 24, 10), K.white, { lw: 3, id: 102 }); shape(R(4, -18, 70, 24, 10), K.white, { lw: 3, id: 103 });
  shape(P([[-104, -200], [-92, -470], [92, -470], [104, -200]]), K.turq, { lw: 4.5, shade: () => X.rect(20, -480, 120, 300), id: 104 });
  shape(R(-50, -300, 100, 50, 12), 'rgba(0,0,0,.0)', { lw: 3, id: 105 });
  arm(-90, -440, 1.8, 120, .15, 110, K.turq, { w: 40, pose: 'open' });
  eggHead(0, -560, .9, K.skin, { mouth: o.mouth, brow: o.brow, look: o.look, blink: o.blink, id: 106 });
  shape(() => { X.moveTo(-76, -590); X.bezierCurveTo(-70, -690, 60, -700, 70, -610); X.bezierCurveTo(40, -650, 0, -620, -20, -650); X.bezierCurveTo(-40, -610, -60, -620, -76, -590); }, '#4a2e22', { lw: 3, id: 107 });
  // lifting arm (curl) with dumbbell
  const c = o.curl || 0, sx = 90, sy = -440;
  const a1 = 1.45, a2 = lerp(.05, -2.3, c);
  const r = arm(sx, sy, a1, 130, a2, 120, K.turq, { w: 40, pose: 'fist', hs: 1.1 });
  // dumbbell
  X.save(); X.translate(r.hx, r.hy); X.rotate(a1 + a2 + Math.PI / 2);
  shape(R(-70, -8, 140, 16, 6), K.greyD, { lw: 3, id: 108 }); shape(R(-92, -34, 30, 68, 8), K.ink, { lw: 3, id: 109 }); shape(R(62, -34, 30, 68, 8), K.ink, { lw: 3, id: 110 });
  X.restore();
  X.restore();
  return r;
}

// round call-out with a leader line (drawn at native scale)
function callout(t, t0, cx, cy, r, tx, ty, draw, o = {}) {

function talking(t, ids) { // mouth flap from word timings
  for (const id of ids) { const l = L[id]; if (!l || t < l.t0 || t > l.t1) continue;
    for (const k of l.kelimeler || []) if (t >= k.t0 && t <= k.t1) { const u = (t - k.t0) / Math.max(.08, k.t1 - k.t0); return Math.abs(Math.sin(u * Math.PI * Math.max(1, Math.round((k.t1 - k.t0) * 6)))) * .9 + .1; } }
