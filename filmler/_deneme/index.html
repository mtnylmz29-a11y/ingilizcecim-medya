<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body><canvas id=c width=1080 height=1920></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let Z=null;
fetch('ses/zaman.json').then(r=>r.json()).then(z=>{Z=z;window.DUR=Math.max(36,z.dur);window.EV=z.satirlar.map(l=>({t:l.t0,type:'pop'}));window.READY=true;});
window.render=t=>{x.fillStyle='#14213d';x.fillRect(0,0,1080,1920);x.fillStyle='#fca311';x.beginPath();x.arc(540+300*Math.sin(t),900,140,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 64px sans-serif';x.textAlign='center';const l=Z&&Z.satirlar.find(l=>t>=l.t0&&t<=l.t1+.3);if(l)x.fillText(l.metin,540,1500);x.fillText('t='+t.toFixed(1),540,300)};
</script></body></html>
